- name: Count solved problems
  id: count
  shell: bash
  run: |
    total=$(find . \
      -type f \
      \( -name "*.cpp" -o -name "*.c" -o -name "*.sql" -o -name "*.sh" \) \
      | sed 's#.*/##' \
      | awk '/^[0-9]{4}-/' \
      | cut -d'-' -f1 \
      | sort -u \
      | wc -l)

    cpp=$(find . -type f -name "*.cpp" \
      | sed 's#.*/##' \
      | awk '/^[0-9]{4}-/' \
      | cut -d'-' -f1 \
      | sort -u \
      | wc -l)

    c=$(find . -type f -name "*.c" \
      | sed 's#.*/##' \
      | awk '/^[0-9]{4}-/' \
      | cut -d'-' -f1 \
      | sort -u \
      | wc -l)

    sql=$(find . -type f -name "*.sql" \
      | sed 's#.*/##' \
      | awk '/^[0-9]{4}-/' \
      | cut -d'-' -f1 \
      | sort -u \
      | wc -l)

    shell=$(find . -type f -name "*.sh" \
      | sed 's#.*/##' \
      | awk '/^[0-9]{4}-/' \
      | cut -d'-' -f1 \
      | sort -u \
      | wc -l)

    echo "total=$total" >> "$GITHUB_OUTPUT"
    echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
    echo "c=$c" >> "$GITHUB_OUTPUT"
    echo "sql=$sql" >> "$GITHUB_OUTPUT"
    echo "shell=$shell" >> "$GITHUB_OUTPUT"

    echo "Total: $total"
    echo "C++: $cpp"
    echo "C: $c"
    echo "SQL: $sql"
    echo "Shell: $shell"