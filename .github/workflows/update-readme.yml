name: Update README Problem Count

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Count solved problems
        id: count
        shell: bash
        run: |
          count=$(find . \
            -type f \
            \( -name "*.cpp" -o -name "*.c" -o -name "*.sql" -o -name "*.sh" \) \
            | sed 's#.*/##' \
            | grep -E '^[0-9]{4}-' \
            | cut -d'-' -f1 \
            | sort -u \
            | wc -l)

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Solved problems: $count"

      - name: Update README
        shell: bash
        run: |
          count="${{ steps.count.outputs.count }}"

          sed -i -E \
            "s#Solved Problems: \*\*<!-- SOLVED_COUNT -->[0-9]+<!-- SOLVED_COUNT -->\*\*#Solved Problems: **<!-- SOLVED_COUNT -->${count}<!-- SOLVED_COUNT -->**#" \
            README.md

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "update solved problem count"
          git push